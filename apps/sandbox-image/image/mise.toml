# The image's base mise.toml, which commands read as mise's system config (`BASE_MISE_CONFIG`,
# apps/sandbox-image/src/env.ts). The image build installs these Toolchains into mise's system directory and locks them.

[settings]
lockfile = true
lockfile_platforms = ["linux-x64"]

[tools]
"conda:git" = "2.56.0"
bun = "1.4.4"
gh = "2.103.3"
node = "26.13.0"
pnpm = "12.17.0"
python = "3.14.10"
uv = "0.13.7"
