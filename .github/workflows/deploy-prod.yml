name: Deploy prod

# Every push to main deploys the `prod` stage (the owner's Environment): `pnpm run check`, then
# `apps/environment/scripts/stage.ts deploy prod`, then a smoke check that leaves nothing behind (scripts/smoke.ts: the
# web client; the read-only admin health route, which must report this commit; and the host's root OAuth documents,
# which must still be t3's, ADR-0036. The two documents boot t3 in the Environment DO; no Container).
# Docs-only pushes are skipped. A manual run may deploy the `bump` stage instead, to try the job without touching prod.
# The smoke check also asserts that t3's descriptor reports the pin's tag as its `serverVersion` (in-app updates D16).
#
# The land workflow (land.yml, ADR-0037) dispatches this with `checked_sha`, the commit it just fast-forwarded main to: a
# push made with GITHUB_TOKEN starts no workflow, so this dispatch is what deploys a landed Update. The job deploys
# exactly that commit, and only while it is main's tip, on any stage: a dispatch never builds a commit other than
# main's tip (review cycle 3). The run's name carries the stage and the commit, which is how land.yml finds it.
# The pnpm store cache (restored, and saved after a pass, under the lock's key) is used on prod only, where the code is
# main's; a `bump` stage deploy neither restores nor saves it (ADR-0037 §4).
#
# Needs, made by `pnpm --filter @t3flare/infra run ci:setup` (infra/github.ts) on the GitHub environment `prod` (main only):
#   secrets.CLOUDFLARE_API_TOKEN   the account token `t3flare-ci-prod`
#   vars.CLOUDFLARE_ACCOUNT_ID     the account the stages deploy to
#   vars.T3FLARE_DOMAIN            prod's custom domain (unset on `bump`, which stays on workers.dev)
#   secrets.T3FLARE_GITHUB_APP_ID, secrets.T3FLARE_GITHUB_APP_PRIVATE_KEY
#   secrets.T3FLARE_MODEL_ENDPOINT   the Model endpoints stage.ts sets up through the panel's API after the deploy
#     (SPI-1175; one, or a list): each added when prod has no endpoint of its id, never changed once there. Unset: skipped, and the log says so.
#   secrets.T3_BOOTSTRAP_TOKEN, secrets.T3FLARE_ADMIN_TOKEN   prod's own tokens, the same as the laptop's
#     (apps/environment/.alchemy/stages/prod.env.json); stage.ts refuses to make new ones for prod in CI.
# The Access service token's credentials come from alchemy's state on every deploy, so nothing else is stored.
# The secrets reach only the Deploy and Smoke steps, never the install or the check, where dependency code runs
# (review H4; dependency build scripts are denied too, pnpm-workspace.yaml's allowBuilds). One exception:
# T3FLARE_MODEL_ENDPOINT also reaches the "Mask the Model endpoint" step, which runs node on
# apps/environment/scripts/mask-endpoint.ts alone (no dependency code) and writes only GitHub's mask commands to the log.

run-name: ${{ inputs.checked_sha && format('Deploy {0} {1}', inputs.stage, inputs.checked_sha) || '' }}

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      stage:
        description: "The stage to deploy: prod, or bump to try the job"
        type: choice
        options: [prod, bump]
        default: prod
      checked_sha:
        description: "The commit to deploy (land.yml: the proven pin it landed); it must be main's tip"
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.stage || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.stage || 'prod' }}
      url: ${{ vars.T3FLARE_DOMAIN && format('https://{0}', vars.T3FLARE_DOMAIN) || format('https://t3flare-environment-{0}.ian-g-pascoe.workers.dev', inputs.stage || 'prod') }}
    env:
      STAGE: ${{ inputs.stage || 'prod' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      T3FLARE_DOMAIN: ${{ vars.T3FLARE_DOMAIN }}
      # The Workspace sweep's real purge (SPI-974): `1` on prod once the owner turned it on.
      T3FLARE_SWEEP_PURGE: ${{ vars.T3FLARE_SWEEP_PURGE }}
      NPM_CONFIG_WORKSPACE_DIR: ${{ github.workspace }}
    steps:
      # The submodule is fetched by hand, not by the action (see bump.yml).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checked_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A landed commit deploys only while main is still it, on any stage (stage.ts also refuses prod off main).
      - name: The checked commit is main
        if: inputs.checked_sha
        run: |
          main=$(git rev-parse origin/main)
          if [ "$main" != "$CHECKED_SHA" ]; then echo "main is $main, not the checked $CHECKED_SHA"; exit 1; fi
        env:
          CHECKED_SHA: ${{ inputs.checked_sha }}

      - run: git submodule update --init t3code

      # The Server version the smoke check expects: the pin's tag without its `v` (stage.ts refuses prod off a tag).
      - name: Server version
        id: version
        run: echo "server=$(git -C t3code describe --tags --exact-match HEAD | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      # Node, pnpm and Vite+ at package.json's versions, then a frozen install (ADR-0030). The store cache on prod only.
      - uses: ./.github/actions/setup
        with:
          cache: ${{ (inputs.stage || 'prod') == 'prod' && 'true' || 'false' }}

      # SPI-1175: GitHub masks only the whole secret, so its key and header values are masked each on its own, before any
      # step that could print one. The commands go to the runner's log only, never a file.
      - name: Mask the Model endpoint
        run: node apps/environment/scripts/mask-endpoint.ts
        env:
          T3FLARE_MODEL_ENDPOINT: ${{ secrets.T3FLARE_MODEL_ENDPOINT }}

      - run: pnpm run check

      - name: Deploy
        working-directory: apps/environment
        run: node scripts/stage.ts deploy "$STAGE" --web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The Model endpoint (SPI-1175); unset until `ci:setup` sets it, and then skipped.
          T3FLARE_MODEL_ENDPOINT: ${{ secrets.T3FLARE_MODEL_ENDPOINT }}
          T3FLARE_GITHUB_APP_ID: ${{ secrets.T3FLARE_GITHUB_APP_ID }}
          T3FLARE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.T3FLARE_GITHUB_APP_PRIVATE_KEY }}
          # Unset on `bump`, whose tokens the job makes fresh.
          T3_BOOTSTRAP_TOKEN: ${{ secrets.T3_BOOTSTRAP_TOKEN }}
          T3FLARE_ADMIN_TOKEN: ${{ secrets.T3FLARE_ADMIN_TOKEN }}

      - name: Smoke check
        working-directory: apps/environment
        run: node scripts/stage.ts run "$STAGE" smoke "$COMMIT" "$SERVER_VERSION"
        # The same secrets as Deploy.
        env:
          COMMIT: ${{ inputs.checked_sha || github.sha }}
          SERVER_VERSION: ${{ steps.version.outputs.server }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          T3FLARE_GITHUB_APP_ID: ${{ secrets.T3FLARE_GITHUB_APP_ID }}
          T3FLARE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.T3FLARE_GITHUB_APP_PRIVATE_KEY }}
          # Unset on `bump`, whose tokens the job makes fresh.
          T3_BOOTSTRAP_TOKEN: ${{ secrets.T3_BOOTSTRAP_TOKEN }}
          T3FLARE_ADMIN_TOKEN: ${{ secrets.T3FLARE_ADMIN_TOKEN }}
