# TEMPORARY (SPI-1087): `bun run check` on the spi1087 branch, without deploying, plus the restart tests looped on the
# runner. Delete before merging.
name: SPI-1087 check

on:
  push:
    branches: [spi1087]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - run: git submodule update --init t3code

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Restart tests, 10 times each
        working-directory: apps/agents
        run: |
          for i in $(seq 1 10); do
            echo "::group::run $i"
            npx vitest run test/codemodeGuards.test.ts test/permissions.test.ts test/askUser.test.ts
            echo "::endgroup::"
          done
