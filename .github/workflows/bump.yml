name: Nightly bump

# ADR-0017, ADR-0037: pin a t3code nightly tag, prove it on the `bump` stage, and propose it as a pull request, or (an
# in-app Update, `land: true`) land it. `pnpm run bump` (scripts/bump.ts) does the work and leaves the pin unchanged when
# any step fails.
#
# Four kinds of run, each named by `run-name` (the Environment DO finds an Update's run by it, ADR-0037):
#   Nightly bump      hourly: the newest nightly, unless main pins it or it is proposed through the Full gate already,
#                     through the Full gate, as a pull request (PR-only; a newer proposal closes the older ones).
#   Update <id>       a stock client's server Update (the Environment DO dispatches it with `tag`, `land: true`,
#                     `gate: update` and `update_id`): the Update gate, then land.yml. A tag main already pins only
#                     deploys (a retry of a land whose deploy failed); a `bump/<tag>` proven on top of main lands as it is.
#   Verify <what>     dispatched by land.yml after an Update landed (`verify`, `force`, `dry_run`): main's pin through the
#                     Full gate. A failure of any kind opens an issue naming what landed and the failed step (D18).
#   (by hand)         `tag`, `force`, `dry_run` as before.
#
# Trust (review F1): only the `bump` job runs upstream and dependency code, and its token reads contents and nothing else.
# It hands the proven commit to the others as an artifact (a git bundle and its report). `plan`, `publish`,
# `verify-issue` and land.yml run on fresh runners with plain Node and main's own scripts (`scripts/updates-ci.ts`,
# `scripts/land-check.ts`), treat the report as untrusted input, and check the commit's content before they push it, mark
# it proven (`t3flare/proven`, which Container tokens cannot set) or land it.
#
# Every run checks out the tip of main when it starts. This workflow and cli-bump.yml share the `bump` concurrency group
# with `queue: max`: runs wait their turn in order, none is cancelled for a newer one.
#
# Needs, made by `pnpm --filter @t3flare/infra run ci:setup` (infra/github.ts), on the `bump` environment (the bump job's
# only): secrets.CLOUDFLARE_API_TOKEN (`t3flare-ci-bump`), vars.CLOUDFLARE_ACCOUNT_ID, secrets.T3FLARE_MODEL_ENDPOINT
# (SPI-1175: the Model endpoints the stage and the acceptance test set up; unset, the real turn fails), and from
# `github-app:setup` secrets.T3FLARE_GITHUB_APP_ID and secrets.T3FLARE_GITHUB_APP_PRIVATE_KEY; and the repository setting
# that lets Actions create pull requests (infra/allow-actions-prs.ts). The stage's own tokens are made fresh by the job.
# The secrets reach only the Bump step, and the Model endpoint the masking step before it (node on mask-endpoint.ts
# alone). Prod's secrets never reach this workflow: land.yml deploys prod by dispatching deploy-prod.yml.

run-name: ${{ inputs.verify && format('Verify {0}', inputs.verify) || inputs.update_id && format('Update {0}', inputs.update_id) || 'Nightly bump' }}

on:
  schedule:
    # Hourly (ADR-0037, pre-proving): a new nightly is proven and proposed within the hour, so an Update to it only lands.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "A t3code tag to pin instead of the newest nightly"
        required: false
      force:
        description: "Deploy and test even when the pin is already the newest nightly"
        type: boolean
        default: false
      dry_run:
        description: "Do not commit or propose the pin"
        type: boolean
        default: false
      land:
        description: "Land the proven pin on main and deploy prod (an in-app Update; ADR-0037)"
        type: boolean
        default: false
      gate:
        description: "The gate that proves the pin: full, or update (an in-app Update's)"
        type: choice
        options: [full, update]
        default: full
      update_id:
        description: "The in-app Update's id, which names the run"
        required: false
      verify:
        description: "What landed, when this run verifies it through the Full gate (land.yml dispatches it)"
        required: false

permissions: {}

concurrency:
  group: bump
  cancel-in-progress: false
  queue: max

jobs:
  # Trusted: decides before any upstream code runs. Reads tags, branches and the `t3flare/proven` statuses.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Plan
        id: plan
        run: node scripts/updates-ci.ts plan-t3 --event "$EVENT" --tag "$TAG" --land "$LAND" --verify "$VERIFY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
          LAND: ${{ inputs.land }}
          VERIFY: ${{ inputs.verify }}

  # Untrusted: runs upstream and dependency code. Its token reads contents only; it publishes nothing itself.
  bump:
    needs: plan
    if: needs.plan.outputs.mode == 'bump'
    runs-on: ubuntu-latest
    # An Update's run fails within 20 minutes (ADR-0037, D7). The Full gate: test:docker and the acceptance CLI turns.
    timeout-minutes: ${{ inputs.update_id && 20 || 60 }}
    environment: bump
    permissions:
      contents: read
    env:
      NPM_CONFIG_WORKSPACE_DIR: ${{ github.workspace }}
    steps:
      # The tip of main, whatever commit the dispatch named. The submodule is fetched by hand, not by the action: the
      # action walks t3code's nested gitlinks recursively, and one of them has no URL, which fails the checkout.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - run: git submodule update --init t3code

      # Node, pnpm and Vite+ at package.json's versions, then a frozen install (ADR-0030).
      - uses: ./.github/actions/setup

      # SPI-1175: GitHub masks only the whole secret, so its key and header values are masked each on its own.
      - name: Mask the Model endpoint
        run: node apps/environment/scripts/mask-endpoint.ts
        env:
          T3FLARE_MODEL_ENDPOINT: ${{ secrets.T3FLARE_MODEL_ENDPOINT }}

      - name: Bump
        run: |
          args=(--report bump-report.json --gate "${GATE:-full}")
          if [ "$DRY_RUN" != "true" ]; then args+=(--commit); fi
          # A verify run re-proves main's own pin.
          if [ -n "$VERIFY" ]; then TAG=$(git -C t3code describe --tags --exact-match HEAD); fi
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          if [ "$FORCE" != "true" ]; then args+=(--skip-if-current); fi
          git config user.name "t3flare-bump"
          git config user.email "t3flare-bump@users.noreply.github.com"
          pnpm run bump "${args[@]}"
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          GATE: ${{ inputs.gate }}
          VERIFY: ${{ inputs.verify }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          T3FLARE_MODEL_ENDPOINT: ${{ secrets.T3FLARE_MODEL_ENDPOINT }}
          T3FLARE_GITHUB_APP_ID: ${{ secrets.T3FLARE_GITHUB_APP_ID }}
          T3FLARE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.T3FLARE_GITHUB_APP_PRIVATE_KEY }}

      - name: Report
        if: always()
        run: |
          if [ -f bump-report.json ]; then
            {
              echo "## t3code bump"
              echo '```json'
              jq '{ok, gate, from, to, changed, note, steps: [.steps[] | {name, ok, seconds}], acceptance: (.acceptance | if . then {ok, failures, serverVersion, modelEndpoint, textGeneration, sqlAdapter, threadWindow, search, realTurn: (.realTurn | if . then {ok, failures, clone, turn, checkpointOps} else null end)} else null end), lock, rollback}' bump-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The proven commit, for the trusted publish job: a bundle of the one commit on top of the base.
      - name: Bundle the pin
        if: success() && inputs.dry_run != true
        run: |
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then git bundle create pin.bundle HEAD "^$BASE"; fi
        env:
          BASE: ${{ steps.base.outputs.sha }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bump
          path: |
            bump-report.json
            pin.bundle
          if-no-files-found: ignore

  # Trusted: checks the proven commit and publishes it. Runs main's scripts with plain Node; never the bump's code.
  publish:
    needs: [plan, bump]
    if: needs.bump.result == 'success' && inputs.dry_run != true && !inputs.verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      changed: ${{ steps.report.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: bump
          path: ${{ runner.temp }}/bump
      - name: Read the report
        id: report
        run: node scripts/updates-ci.ts read-report --kind t3 --file "$RUNNER_TEMP/bump/bump-report.json" --tag "$TAG"
        env:
          TAG: ${{ needs.plan.outputs.tag }}
      - name: Check the proven commit
        id: check
        if: steps.report.outputs.changed == 'true'
        run: |
          git bundle verify "$RUNNER_TEMP/bump/pin.bundle"
          git fetch --quiet "$RUNNER_TEMP/bump/pin.bundle" "HEAD:refs/remotes/candidate"
          node scripts/updates-ci.ts install-yaml
          node scripts/land-check.ts --kind t3 --tag "$TO" --ref refs/remotes/candidate
          echo "sha=$(git rev-parse refs/remotes/candidate)" >> "$GITHUB_OUTPUT"
        env:
          TO: ${{ steps.report.outputs.to }}
      - name: Push and mark it proven
        if: steps.report.outputs.changed == 'true'
        run: |
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SHA:refs/heads/bump/$TO"
          node scripts/updates-ci.ts set-proven --sha "$SHA" --gate "$GATE" --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ steps.check.outputs.sha }}
          TO: ${{ steps.report.outputs.to }}
          GATE: ${{ steps.report.outputs.gate }}
      # Not an Update: a pull request for the owner, which closes the older bump pull requests it supersedes.
      - name: Propose it
        if: steps.report.outputs.changed == 'true' && inputs.land != true
        run: |
          branch="bump/$TO"
          gh pr create --head "$branch" --base main --title "chore: bump t3code to $TO" \
            --body "Pinned by the nightly bump job; the $GATE gate passed on the \`bump\` stage. See the run's report: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            || echo "A pull request for $branch already exists."
          gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | test("^bump/v[0-9]")) | select(.headRefName != "'"$branch"'") | .number' \
            | while read -r number; do gh pr close "$number" --comment "Superseded by $branch." || true; done
        env:
          GH_TOKEN: ${{ github.token }}
          TO: ${{ steps.report.outputs.to }}
          GATE: ${{ steps.report.outputs.gate }}

  # D18, review A3: a verify run that does not pass, for any reason (a failure, a timeout, a cancellation), opens an
  # issue (GitHub Issues sync to Linear). No automatic revert: migrations only go forward.
  verify-issue:
    needs: [plan, bump]
    if: always() && inputs.verify && needs.bump.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bump
          path: ${{ runner.temp }}/bump
      - name: Open an issue
        run: |
          node scripts/updates-ci.ts issue-body --verify "$VERIFY" --file "$RUNNER_TEMP/bump/bump-report.json" \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/issue.md"
          gh issue create --title "Verify did not pass after an in-app Update landed" --body-file "$RUNNER_TEMP/issue.md"
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY: ${{ inputs.verify }}

  # ADR-0037: an Update lands its proven pin, or only deploys a pin main already holds (review F2).
  land:
    needs: [plan, publish]
    if: always() && inputs.land && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'land' || (needs.publish.result == 'success' && needs.publish.outputs.changed == 'true'))
    permissions:
      contents: write
      actions: write
      statuses: read
    uses: ./.github/workflows/land.yml
    with:
      kind: t3
      tag: ${{ needs.plan.outputs.tag }}
