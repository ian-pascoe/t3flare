name: Nightly bump

# ADR-0017, ADR-0037: pin a t3code nightly tag, prove it on the `bump` stage, and propose it as a pull request, or (an
# in-app Update, `land: true`) land it. `pnpm run bump` (scripts/bump.ts) does the work and leaves the pin unchanged when
# any step fails.
#
# Four kinds of run, each named by `run-name` (the Environment DO finds an Update's run by it, ADR-0037):
#   Nightly bump      hourly: the newest nightly, unless main pins it or it is proposed through the Full gate already,
#                     through the Full gate, as a pull request (PR-only; a newer proposal closes the older ones). Also
#                     skipped when its two newest hourly attempts failed the move, the lock check or the check on
#                     this same commit of main (ADR-0017's 2026-11-19 refinement): nothing has changed to pass it.
#   Update <id>       a stock client's server Update (the Environment DO dispatches it with `tag`, `land: true`,
#                     `gate: update` and `update_id`): the Update gate, then land.yml. A tag main already pins only
#                     deploys (a retry of a land whose deploy failed); a `bump/<tag>` proven on top of main lands as it is.
#   Verify <what>     dispatched by land.yml after an Update landed (`verify`, `force`, `dry_run`): main's pin through the
#                     Full gate. A failure of any kind opens an issue naming what landed and the failed step (D18).
#   (by hand)         `tag`, `force`, `dry_run` as before.
#
# Trust (review F1, B1, B4): only the `bump` job runs upstream and dependency code; its token reads contents and nothing
# else, and it saves no dependency cache. It hands the proven commit to the others as an artifact (a git bundle and its
# report). `plan`, `publish`, `verify-issue` and land.yml run on fresh runners with plain Node and main's own scripts
# (`scripts/updates-ci.ts`, `scripts/land-check.ts`), treat the report as untrusted input, and check the commit's content
# (with no token in that step) before they push it, mark it proven (`t3flare/proven`) or land it. Land is bound to the
# proven commit: land.yml lands only the exact commit `plan` or `publish` names, while its branch still points at it and
# its proof names a run of this workflow on main.
# `dry_run` runs the whole path to the check (plan, bump, the publish job's land check) and pushes, marks, proposes and
# lands nothing.
#
# Every run checks out the tip of main when it starts. This workflow and cli-bump.yml share the `bump` concurrency group
# with `queue: max`: runs wait their turn in order, none is cancelled for a newer one.
#
# Needs, made by `pnpm --filter @t3flare/infra run ci:setup` (infra/github.ts), on the `bump` environment (the bump job's
# only): secrets.CLOUDFLARE_API_TOKEN (`t3flare-ci-bump`), vars.CLOUDFLARE_ACCOUNT_ID, secrets.T3FLARE_MODEL_ENDPOINT
# (SPI-1175: the Model endpoints the stage and the acceptance test set up; unset, the real turn fails), and from
# `github-app:setup` secrets.T3FLARE_GITHUB_APP_ID and secrets.T3FLARE_GITHUB_APP_PRIVATE_KEY; and the repository setting
# that lets Actions create pull requests (infra/allow-actions-prs.ts). The stage's own tokens are made fresh by the job.
# The secrets reach only the Bump step, and the Model endpoint the masking step before it (node on mask-endpoint.ts
# alone). Prod's secrets never reach this workflow: the land job (land.yml) enters only the `land` environment, whose one
# secret is the deploy key it pushes `main` with; that push starts deploy-prod.yml, which holds prod's.

run-name: ${{ inputs.verify && format('Verify {0}', inputs.verify) || inputs.update_id && format('Update {0}', inputs.update_id) || 'Nightly bump' }}

on:
  schedule:
    # Hourly (ADR-0037, pre-proving): a new nightly is proven and proposed within the hour, so an Update to it only lands.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "A t3code tag to pin instead of the newest nightly"
        required: false
      force:
        description: "Deploy and test even when the pin is already the newest nightly"
        type: boolean
        default: false
      dry_run:
        description: "Do not commit or propose the pin"
        type: boolean
        default: false
      land:
        description: "Land the proven pin on main and deploy prod (an in-app Update; ADR-0037)"
        type: boolean
        default: false
      gate:
        description: "The gate that proves the pin: full, or update (an in-app Update's)"
        type: choice
        options: [full, update]
        default: full
      update_id:
        description: "The in-app Update's id, which names the run"
        required: false
      verify:
        description: "What landed, when this run verifies it through the Full gate (land.yml dispatches it)"
        required: false

permissions: {}

concurrency:
  group: bump
  cancel-in-progress: false
  queue: max

jobs:
  # Trusted: decides before any upstream code runs. Reads tags, branches, the `t3flare/proven` statuses and their runs.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
      pin: ${{ steps.plan.outputs.pin }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Plan
        id: plan
        run: node scripts/updates-ci.ts plan-t3 --event "$EVENT" --tag "$TAG" --land "$LAND" --verify "$VERIFY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
          LAND: ${{ inputs.land }}
          VERIFY: ${{ inputs.verify }}

  # Untrusted: runs upstream and dependency code. Its token reads contents only; it publishes and caches nothing itself.
  bump:
    needs: plan
    if: needs.plan.outputs.mode == 'bump'
    runs-on: ubuntu-latest
    # An Update's run fails within 20 minutes (ADR-0037, D7). The Full gate: test:docker and the acceptance CLI turns.
    timeout-minutes: ${{ inputs.update_id && 20 || 60 }}
    environment: bump
    permissions:
      contents: read
    env:
      NPM_CONFIG_WORKSPACE_DIR: ${{ github.workspace }}
    steps:
      # The tip of main, whatever commit the dispatch named. The submodule is fetched by hand, not by the action: the
      # action walks t3code's nested gitlinks recursively, and one of them has no URL, which fails the checkout.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - run: git submodule update --init t3code

      # Node, pnpm and Vite+ at package.json's versions, then a frozen install (ADR-0030). No cache: a store this job
      # saved would be restored by deploy-prod (review B4).
      - uses: ./.github/actions/setup
        with:
          cache: "false"

      # SPI-1175: GitHub masks only the whole secret, so its key and header values are masked each on its own.
      - name: Mask the Model endpoint
        run: node apps/environment/scripts/mask-endpoint.ts
        env:
          T3FLARE_MODEL_ENDPOINT: ${{ secrets.T3FLARE_MODEL_ENDPOINT }}

      # The pin is committed here (locally) even on a dry run, so the trusted job can check it; nothing pushes it.
      - name: Bump
        run: |
          args=(--report bump-report.json --gate "${GATE:-full}" --commit)
          # A verify run re-proves main's own pin.
          if [ -n "$VERIFY" ]; then TAG=$(git -C t3code describe --tags --exact-match HEAD); fi
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          if [ "$FORCE" != "true" ]; then args+=(--skip-if-current); fi
          git config user.name "t3flare-bump"
          git config user.email "t3flare-bump@users.noreply.github.com"
          pnpm run bump "${args[@]}"
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          FORCE: ${{ inputs.force }}
          GATE: ${{ inputs.gate }}
          VERIFY: ${{ inputs.verify }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          T3FLARE_MODEL_ENDPOINT: ${{ secrets.T3FLARE_MODEL_ENDPOINT }}
          T3FLARE_GITHUB_APP_ID: ${{ secrets.T3FLARE_GITHUB_APP_ID }}
          T3FLARE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.T3FLARE_GITHUB_APP_PRIVATE_KEY }}

      - name: Report
        if: always()
        run: |
          if [ -f bump-report.json ]; then
            {
              echo "## t3code bump"
              echo '```json'
              jq '{ok, gate, base, from, to, changed, note, steps: [.steps[] | {name, ok, seconds}], unclassifiedCapabilities, t3TypeErrors, acceptanceRetry: (.acceptanceRetry | if . then {firstFailures} else null end), acceptance: (.acceptance | if . then {ok, failures, serverVersion, modelEndpoint, textGeneration, sqlAdapter, threadWindow, search, realTurn: (.realTurn | if . then {ok, failures, clone, turn, checkpointOps} else null end)} else null end), lock, rollback}' bump-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The proven commit, for the trusted publish job: a bundle of the one commit on top of the base.
      - name: Bundle the pin
        if: success()
        run: |
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then git bundle create pin.bundle HEAD "^$BASE"; fi
        env:
          BASE: ${{ steps.base.outputs.sha }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bump
          path: |
            bump-report.json
            pin.bundle
          if-no-files-found: ignore

  # Trusted: checks the proven commit (no token), then publishes it. main's scripts, plain Node, never the bump's code.
  publish:
    needs: [plan, bump]
    if: needs.bump.result == 'success' && !inputs.verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: bump
          path: ${{ runner.temp }}/bump
      # No token here (review A9): the land check runs git and npm on what the bump job made.
      - name: Check the proposal
        id: check
        run: |
          node scripts/updates-ci.ts install-yaml
          node scripts/updates-ci.ts check-proposal --kind t3 --dir "$RUNNER_TEMP/bump" --gate "${GATE:-full}" --tag "$TAG"
        env:
          GATE: ${{ inputs.gate }}
          TAG: ${{ needs.plan.outputs.tag }}
      - name: Push it and mark it proven
        id: push
        if: steps.check.outputs.changed == 'true' && inputs.dry_run != true
        run: node scripts/updates-ci.ts publish-proposal --pin "$PIN" --sha "$SHA" --gate "$GATE"
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ steps.check.outputs.pin }}
          SHA: ${{ steps.check.outputs.sha }}
          GATE: ${{ steps.check.outputs.gate }}
      # Not an Update: a pull request for the owner, which closes the older bump pull requests it supersedes.
      - name: Propose it
        if: steps.check.outputs.changed == 'true' && inputs.dry_run != true && inputs.land != true
        # UNCLASSIFIED, RETRIED and T3_TYPE_ERRORS come from the report through check-proposal, which passes only
        # flag-shaped names, a boolean and a whole number (bumpReportNotes); they go into the body as data, never into a
        # command.
        run: |
          body="Pinned by the nightly bump job; the $GATE gate passed on the \`bump\` stage. See the run's report: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$RETRIED" = "true" ]; then
            body+=$'\n\n'"**The acceptance test passed only on its second attempt.** The pass may be luck: read the first attempt's failures (\`acceptanceRetry\` in the report) before merging (fragility U18)."
          fi
          if [ "${T3_TYPE_ERRORS:-0}" != "0" ]; then
            body+=$'\n\n'"The typecheck passed over $T3_TYPE_ERRORS type error(s) in t3's own files, which only our program's configuration sees (fragility U10): read them in the run's log."
          fi
          if [ -n "$UNCLASSIFIED" ]; then
            body+=$'\n\n'"**New capability flags, stripped until classified** in \`apps/environment/src/t3/capabilities.ts\` (fragility U4): $UNCLASSIFIED"
          fi
          gh pr create --head "$BRANCH" --base main --title "chore: bump t3code to ${BRANCH#bump/}" --body "$body" \
            || echo "A pull request for $BRANCH already exists."
          gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | test("^bump/v[0-9]")) | select(.headRefName != "'"$BRANCH"'") | .number' \
            | while read -r number; do gh pr close "$number" --comment "Superseded by $BRANCH." || true; done
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.push.outputs.branch }}
          GATE: ${{ steps.check.outputs.gate }}
          UNCLASSIFIED: ${{ steps.check.outputs.unclassified }}
          RETRIED: ${{ steps.check.outputs.retried }}
          T3_TYPE_ERRORS: ${{ steps.check.outputs.t3_type_errors }}

  # D18, review A3: a verify run that does not pass, for any reason (a failure, a timeout, a cancellation), opens an
  # issue (GitHub Issues sync to Linear). No automatic revert: migrations only go forward.
  verify-issue:
    needs: [plan, bump]
    if: always() && inputs.verify && needs.bump.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bump
          path: ${{ runner.temp }}/bump
      - name: Open an issue
        run: |
          node scripts/updates-ci.ts issue-body --verify "$VERIFY" --file "$RUNNER_TEMP/bump/bump-report.json" > "$RUNNER_TEMP/issue.md"
          gh issue create --title "Verify did not pass after an in-app Update landed" --body-file "$RUNNER_TEMP/issue.md"
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY: ${{ inputs.verify }}

  # ADR-0037: an Update lands exactly the commit `plan` (its fast path) or `publish` proved, or only deploys a pin main
  # already holds (review F2, B1). Never on a dry run (review B3).
  land:
    needs: [plan, publish]
    if: always() && inputs.land && inputs.dry_run != true && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'land' || (needs.publish.result == 'success' && needs.publish.outputs.changed == 'true'))
    permissions:
      contents: write
      actions: write
      statuses: read
    uses: ./.github/workflows/land.yml
    with:
      pin: ${{ needs.plan.outputs.pin }}
      sha: ${{ needs.publish.outputs.sha || needs.plan.outputs.sha }}
      dry_run: ${{ inputs.dry_run == true }}
