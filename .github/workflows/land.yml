name: Land

# ADR-0037: land a proposed pin. Fast-forward `main` to the exact commit a trusted job proved, and follow the prod deploy
# that push starts (deploy-prod.yml's push run): its conclusion is the Update's outcome. Then delete the landed `bump/*`
# branches at or below the landed version and dispatch the verify run (bump.yml through the Full gate, D18).
#
# The push uses the deploy key T3FLARE_LAND_DEPLOY_KEY, the one secret of the `land` environment (deployable from `main`
# only; it holds none of prod's), because ruleset `main` requires pull requests: deploy keys and admins skip it always,
# and the two Apps only when merging a pull request. This was designed when the repo was a personal account's, where
# GitHub Actions can't be a bypass actor; the repo is now an organisation's, and the design stays (ADR-0037's ADR-0038/0039
# refinement). The t3flare App also mints agents' Container tokens, so it gets no direct-push skip. A deploy-key push,
# unlike a GITHUB_TOKEN one, starts deploy-prod.yml. Two jobs: `check` (no environment, so no key on its runner) binds
# to the proof and runs the land check on the candidate; `land` (environment `land`, its deploy key only) runs only
# main's code and pushes the checked commit as a plain fast-forward (no force; the ruleset skip would allow one, so
# git's own refusal is the guard). ADR-0037 §7.
#
# Bound to the proof (review B1): it lands `sha` only while the pin's branch still points at it, and only when `sha`
# carries a `t3flare/proven` status set by GitHub Actions that names a run of bump.yml or cli-bump.yml on main
# (`scripts/updates-ci.ts land-plan`). It then checks the commit's shape and content itself (`scripts/land-check.ts`,
# no token in that step).
# Idempotent (review F2): when main already holds the pin (or a newer one), there is nothing to push, and the run only
# deploys main's tip. A press after a land whose deploy failed recovers that way, with or without its branch.
#
# The callers pass T3FLARE_LAND_DEPLOY_KEY by name (`secrets:` on their `land` job): a reusable workflow's environment
# secret resolves to an empty string unless its caller passes it, and the passed name still resolves to the `land`
# environment's value only in the job that enters that environment.
#
# Called by bump.yml and cli-bump.yml on a fresh runner that ran no upstream code and holds no stage secrets, with the
# pin as one validated string (`t3:<tag>`, `cli:<cli>:<version>`). They never call it on a dry run. By hand, `dry_run`
# runs the `check` job only: the binding to the proof and the land check, then nothing (no push, no deploy, no branch
# deleted, no `land` deployment record). It never deploys a commit that is not main's: deploy-prod refuses one (review
# cycle 3). A real run's `land` job passes the `land` environment's branch policy only from `main`.

on:
  workflow_call:
    inputs:
      pin: { type: string, required: true }
      sha: { type: string, required: false, default: "" }
      dry_run: { type: boolean, required: false, default: false }
    secrets:
      T3FLARE_LAND_DEPLOY_KEY: { required: true }
  workflow_dispatch:
    inputs:
      pin:
        description: "The pin: t3:<tag> or cli:<cli>:<version>"
        required: true
      sha:
        description: "The proven commit of the pin's branch (not needed when main already holds the pin)"
        required: false
      dry_run:
        description: "Check only: land, deploy and delete nothing"
        type: boolean
        default: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    # By hand it waits in the `bump` group like any bump; called, it runs in its caller's run.
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Land' && 'bump' || format('land-{0}', github.run_id) }}
      cancel-in-progress: false
      # By hand, wait in order with the bump runs rather than cancel or be cancelled by a pending one.
      queue: max
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      verify: ${{ steps.plan.outputs.verify }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json

      - name: Land or only deploy
        id: plan
        run: node scripts/updates-ci.ts land-plan --pin "$PIN" --sha "$SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIN: ${{ inputs.pin }}
          SHA: ${{ inputs.sha }}

      # No token here: the land check runs git and npm on the branch's commit.
      - name: Check the branch
        if: steps.plan.outputs.mode == 'land'
        run: |
          case "$PIN" in t3:*) node scripts/updates-ci.ts install-yaml ;; esac
          node scripts/land-check.ts --ref "$SHA" --pin "$PIN"
        env:
          PIN: ${{ inputs.pin }}
          SHA: ${{ steps.plan.outputs.sha }}

  land:
    needs: check
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Land' && 'bump' || format('land-{0}', github.run_id) }}
      cancel-in-progress: false
      # By hand, wait in order with the bump runs rather than cancel or be cancelled by a pending one.
      queue: max
    # Long enough to wait out deploy-prod's own 45 minutes and a queue in its group; with the bump job's 20, publish's
    # 15, plan's 5 and check's 5 this stays within an Update's 110 minutes from its start (ADR-0037, U92).
    timeout-minutes: 60
    # For T3FLARE_LAND_DEPLOY_KEY, its only secret; its branch policy admits `main` alone, so a by-hand run from another
    # ref stops here. Nothing from the candidate runs in this job.
    environment: land
    permissions:
      contents: write
      actions: write
    steps:
      # Every branch, so the checked commit is here to push; nothing from it runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json

      # A fast-forward only: a push that is not one is refused, and nothing is forced. The deploy key (see the header)
      # lives in a 0600 file under the runner's temp directory for this step alone; GitHub's host keys come from its API.
      - name: Fast-forward main
        if: needs.check.outputs.mode == 'land'
        run: |
          # The key is set by hand, not by ci:setup (ADR-0037 §7); rotate by replacing the deploy key and this secret.
          if [ -z "$LAND_DEPLOY_KEY" ]; then echo "T3FLARE_LAND_DEPLOY_KEY is not readable (the land environment's secret)."; exit 1; fi
          dir=$(mktemp -d "$RUNNER_TEMP/land-key.XXXXXX")
          trap 'rm -rf "$dir"' EXIT
          (umask 077 && printf '%s\n' "$LAND_DEPLOY_KEY" > "$dir/key")
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$dir/known_hosts"
          GIT_SSH_COMMAND="ssh -F /dev/null -i '$dir/key' -o IdentitiesOnly=yes -o IdentityAgent=none -o UserKnownHostsFile='$dir/known_hosts' -o StrictHostKeyChecking=yes" \
            git push "git@github.com:${GITHUB_REPOSITORY}.git" "$SHA:refs/heads/main"
        env:
          GH_TOKEN: ${{ github.token }}
          LAND_DEPLOY_KEY: ${{ secrets.T3FLARE_LAND_DEPLOY_KEY }}
          SHA: ${{ needs.check.outputs.sha }}

      # A landed commit: follow the push run the deploy key's push started. Deploy-only (main already held the pin), or
      # no push run listed in time: dispatch one for main's tip and follow that.
      - name: Deploy
        run: |
          run=""
          if [ "$MODE" = land ]; then
            for _ in $(seq 1 36); do
              run=$(gh run list --workflow deploy-prod.yml --event push --branch main --commit "$SHA" --json databaseId --jq '.[0].databaseId // empty' || true)
              if [ -n "$run" ]; then break; fi
              sleep 5
            done
          fi
          # A push run listed late would deploy alongside a dispatch: look once more first.
          if [ -z "$run" ] && [ "$MODE" = land ]; then
            run=$(gh run list --workflow deploy-prod.yml --event push --branch main --commit "$SHA" --json databaseId --jq '.[0].databaseId // empty' || true)
          fi
          if [ -z "$run" ]; then
            stage=prod
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run deploy-prod.yml --ref main -f stage="$stage" -f checked_sha="$SHA"
            name="Deploy $stage $SHA"
            for _ in $(seq 1 30); do
              run=$(gh run list --workflow deploy-prod.yml --event workflow_dispatch --created ">=$since" --json databaseId,displayTitle \
                --jq "[.[] | select(.displayTitle == \"$name\")][0].databaseId // empty" || true)
              if [ -n "$run" ]; then break; fi
              sleep 5
            done
          fi
          if [ -z "$run" ]; then echo "The deploy run never appeared."; exit 1; fi
          echo "Following $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
          gh run watch "$run" --interval 15 --exit-status
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.check.outputs.mode }}
          SHA: ${{ needs.check.outputs.sha }}

      # Names from `pins.ts`'s parser only: this kind (and CLI), at or below the landed version.
      - name: Delete the landed bump branches
        run: |
          node scripts/updates-ci.ts landed-branches --pin "$PIN" | while read -r branch; do
            echo "Deleting $branch"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete "$branch" || true
          done
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ inputs.pin }}

      # D18: what landed through an Update gate gets the Full gate on main afterwards; any non-pass opens an issue.
      - name: Dispatch the verify run
        run: gh workflow run bump.yml --ref main -f force=true -f dry_run=true -f gate=full -f verify="$VERIFY"
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY: ${{ needs.check.outputs.verify }}
