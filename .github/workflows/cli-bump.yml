name: CLI bump

# ADR-0037 (in-app updates plan D22): move one CLI agent's pin in the Workspace image (the pi CLI, Codex or Claude Code)
# to its newest version, prove it on the `bump` stage, and land it. t3's provider-update button dispatches it through the
# Environment DO (`t3flare-cli-update <cli>`, D21), which finds the run by its name, `CLI update <update_id>`.
# `pnpm run cli-bump` (scripts/cli-bump.ts) does the work: a version equal to the pin ends the run as unchanged, and a
# failure leaves the pin as it was. The gate is `pnpm run check`, a `bump` stage deploy with the new image, and the
# acceptance test's core plus that CLI's sub-test; the full test:docker and every CLI's sub-test run in the verify run
# after the land (bump.yml, D18). Shares the `bump` concurrency group with bump.yml (`queue: max`, nothing cancelled).
#
# Trust (review F1), as bump.yml: only the `bump` job runs upstream and dependency code, with a token that reads contents
# and nothing else; it hands the proven commit to the trusted `publish` job as an artifact (a git bundle and its report).
# `publish` checks the commit with main's own `scripts/land-check.ts` (the pin made again from main's files and compared
# byte for byte), then pushes `bump/cli-<cli>-<version>`, marks it proven, and calls land.yml. `running` is the version
# prod runs (the Environment DO sends it): when main already holds the newest pin and prod does not run it, the run only
# deploys (review F2).
#
# Needs the `bump` environment's secrets, as bump.yml (see there), in the bump job only; prod's never reach it.

run-name: ${{ inputs.update_id && format('CLI update {0}', inputs.update_id) || format('CLI bump {0}', inputs.cli) }}

on:
  workflow_dispatch:
    inputs:
      cli:
        description: "The CLI agent to bump"
        type: choice
        options: [pi, codex, claude]
      update_id:
        description: "The in-app Update's id, which names the run"
        required: false
      dry_run:
        description: "Prove the newest version on the bump stage; commit, push and land nothing"
        type: boolean
        default: false
      running:
        description: "The version of the CLI prod runs (as its bump branch names it), from the Environment DO"
        required: false

permissions: {}

concurrency:
  group: bump
  cancel-in-progress: false
  queue: max

jobs:
  # Untrusted: runs upstream and dependency code; its token reads contents only.
  bump:
    runs-on: ubuntu-latest
    # An Update's run fails within 20 minutes (ADR-0037, D7).
    timeout-minutes: ${{ inputs.update_id && 20 || 45 }}
    environment: bump
    permissions:
      contents: read
    env:
      NPM_CONFIG_WORKSPACE_DIR: ${{ github.workspace }}
    steps:
      # The tip of main, whatever commit the dispatch named. The submodule by hand (see bump.yml).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - run: git submodule update --init t3code

      - uses: ./.github/actions/setup

      - name: Mask the Model endpoint
        run: node apps/environment/scripts/mask-endpoint.ts
        env:
          T3FLARE_MODEL_ENDPOINT: ${{ secrets.T3FLARE_MODEL_ENDPOINT }}

      - name: CLI bump
        run: |
          args=(--cli "$CLI" --report cli-bump-report.json)
          if [ "$DRY_RUN" != "true" ]; then args+=(--commit); fi
          git config user.name "t3flare-bump"
          git config user.email "t3flare-bump@users.noreply.github.com"
          pnpm run cli-bump "${args[@]}"
        env:
          CLI: ${{ inputs.cli }}
          DRY_RUN: ${{ inputs.dry_run }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          T3FLARE_MODEL_ENDPOINT: ${{ secrets.T3FLARE_MODEL_ENDPOINT }}
          T3FLARE_GITHUB_APP_ID: ${{ secrets.T3FLARE_GITHUB_APP_ID }}
          T3FLARE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.T3FLARE_GITHUB_APP_PRIVATE_KEY }}

      - name: Report
        if: always()
        run: |
          if [ -f cli-bump-report.json ]; then
            {
              echo "## CLI bump"
              echo '```json'
              jq '{ok, cli, gate, from, to, changed, pins, note, steps: [.steps[] | {name, ok, seconds}], acceptance: (.acceptance | if . then {ok, failures} else null end)}' cli-bump-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Bundle the pin
        if: success() && inputs.dry_run != true
        run: |
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then git bundle create pin.bundle HEAD "^$BASE"; fi
        env:
          BASE: ${{ steps.base.outputs.sha }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-bump
          path: |
            cli-bump-report.json
            pin.bundle
          if-no-files-found: ignore

  # Trusted: checks the proven commit and publishes it; main's scripts, plain Node, never the bump's code.
  publish:
    needs: bump
    if: needs.bump.result == 'success' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
    outputs:
      land: ${{ steps.report.outputs.land }}
      to: ${{ steps.report.outputs.to }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: cli-bump
          path: ${{ runner.temp }}/cli-bump
      - name: Read the report
        id: report
        run: node scripts/updates-ci.ts read-report --kind cli --cli "$CLI" --running "$RUNNING" --file "$RUNNER_TEMP/cli-bump/cli-bump-report.json"
        env:
          CLI: ${{ inputs.cli }}
          RUNNING: ${{ inputs.running }}
      - name: Check, push and mark it proven
        if: steps.report.outputs.changed == 'true'
        run: |
          git bundle verify "$RUNNER_TEMP/cli-bump/pin.bundle"
          git fetch --quiet "$RUNNER_TEMP/cli-bump/pin.bundle" "HEAD:refs/remotes/candidate"
          node scripts/land-check.ts --ref refs/remotes/candidate --kind cli --cli "$CLI" --version "$TO"
          sha=$(git rev-parse refs/remotes/candidate)
          branch=$(node scripts/updates-ci.ts land-plan --kind cli --cli "$CLI" --version "$TO" | sed -n 's/^branch=//p')
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$sha:refs/heads/$branch"
          node scripts/updates-ci.ts set-proven --sha "$sha" --gate update --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          CLI: ${{ inputs.cli }}
          TO: ${{ steps.report.outputs.to }}

  land:
    needs: publish
    if: needs.publish.outputs.land == 'true'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/land.yml
    with:
      kind: cli
      cli: ${{ inputs.cli }}
      version: ${{ needs.publish.outputs.to }}
