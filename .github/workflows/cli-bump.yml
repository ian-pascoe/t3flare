name: CLI bump

# ADR-0037 (in-app updates plan D22): move one CLI agent's pin in the Workspace image (the pi CLI, Codex or Claude Code)
# to its newest version, prove it on the `bump` stage, and land it. t3's provider-update button dispatches it through the
# Environment DO (`t3flare-cli-update <cli>`, D21), which finds the run by its name, `CLI update <update_id>`.
# `pnpm run cli-bump` (scripts/cli-bump.ts) does the work: a version equal to the pin ends the run as unchanged, and a
# failure leaves the pin as it was. The gate is `pnpm run check`, a `bump` stage deploy with the new image, and the
# acceptance test's core plus that CLI's sub-test; the full test:docker and every CLI's sub-test run in the verify run
# after the land (bump.yml, D18). Shares the `bump` concurrency group with bump.yml (`queue: max`, nothing cancelled).
#
# Trust (review F1, B1, B4), as bump.yml: only the `bump` job runs upstream and dependency code, with a token that reads
# contents and nothing else and no dependency cache; it hands the proven commit to the trusted `publish` job as an
# artifact (a git bundle and its report). `publish` checks the commit with main's own `scripts/land-check.ts` (the pin
# made again from main's files and compared byte for byte) in a step with no token, then pushes
# `bump/cli-<cli>-<version>`, marks it proven, and calls land.yml with that exact commit. `running` is the version prod
# runs (the Environment DO sends it): when main already holds the newest pin and prod does not run it, the run only
# deploys main (review F2). `dry_run` runs the path through the check and pushes, marks and lands nothing (review B3).
#
# Needs the `bump` environment's secrets, as bump.yml (see there), in the bump job only; prod's never reach it
# (land.yml's job enters only the `land` environment, whose one secret is its deploy key).

run-name: ${{ inputs.update_id && format('CLI update {0}', inputs.update_id) || format('CLI bump {0}', inputs.cli) }}

on:
  workflow_dispatch:
    inputs:
      cli:
        description: "The CLI agent to bump"
        type: choice
        options: [pi, codex, claude]
      update_id:
        description: "The in-app Update's id, which names the run"
        required: false
      dry_run:
        description: "Prove the newest version on the bump stage; commit, push and land nothing"
        type: boolean
        default: false
      running:
        description: "The version of the CLI prod runs (as its bump branch names it), from the Environment DO"
        required: false

permissions: {}

concurrency:
  group: bump
  cancel-in-progress: false
  queue: max

jobs:
  # Untrusted: runs upstream and dependency code; its token reads contents only.
  bump:
    runs-on: ubuntu-latest
    # An Update's run fails within 20 minutes (ADR-0037, D7).
    timeout-minutes: ${{ inputs.update_id && 20 || 45 }}
    environment: bump
    permissions:
      contents: read
    env:
      NPM_CONFIG_WORKSPACE_DIR: ${{ github.workspace }}
    steps:
      # The tip of main, whatever commit the dispatch named. The submodule by hand (see bump.yml).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - run: git submodule update --init t3code

      # No cache: a store this job saved would be restored by deploy-prod (review B4).
      - uses: ./.github/actions/setup
        with:
          cache: "false"

      - name: Mask the Model endpoint
        run: node apps/environment/scripts/mask-endpoint.ts
        env:
          T3FLARE_MODEL_ENDPOINT: ${{ secrets.T3FLARE_MODEL_ENDPOINT }}

      - name: CLI bump
        run: |
          # Committed here (locally) even on a dry run, so the trusted job can check it; nothing pushes it.
          args=(--cli "$CLI" --report cli-bump-report.json --commit)
          git config user.name "t3flare-bump"
          git config user.email "t3flare-bump@users.noreply.github.com"
          pnpm run cli-bump "${args[@]}"
        env:
          CLI: ${{ inputs.cli }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          T3FLARE_MODEL_ENDPOINT: ${{ secrets.T3FLARE_MODEL_ENDPOINT }}
          T3FLARE_GITHUB_APP_ID: ${{ secrets.T3FLARE_GITHUB_APP_ID }}
          T3FLARE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.T3FLARE_GITHUB_APP_PRIVATE_KEY }}

      - name: Report
        if: always()
        run: |
          if [ -f cli-bump-report.json ]; then
            {
              echo "## CLI bump"
              echo '```json'
              jq '{ok, cli, gate, from, to, changed, pins, note, steps: [.steps[] | {name, ok, seconds}], acceptance: (.acceptance | if . then {ok, failures} else null end)}' cli-bump-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Bundle the pin
        if: success()
        run: |
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then git bundle create pin.bundle HEAD "^$BASE"; fi
        env:
          BASE: ${{ steps.base.outputs.sha }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-bump
          path: |
            cli-bump-report.json
            pin.bundle
          if-no-files-found: ignore

  # Trusted: checks the proven commit (no token), then publishes it; main's scripts, plain Node, never the bump's code.
  publish:
    needs: bump
    if: needs.bump.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
    outputs:
      call_land: ${{ steps.check.outputs.call_land }}
      pin: ${{ steps.check.outputs.pin }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: cli-bump
          path: ${{ runner.temp }}/cli-bump
      # No token here (review A9): the land check runs npm to make the pin again.
      - name: Check the proposal
        id: check
        run: node scripts/updates-ci.ts check-proposal --kind cli --dir "$RUNNER_TEMP/cli-bump" --cli "$CLI" --running "$RUNNING"
        env:
          CLI: ${{ inputs.cli }}
          RUNNING: ${{ inputs.running }}
      - name: Push it and mark it proven
        if: steps.check.outputs.changed == 'true' && inputs.dry_run != true
        run: node scripts/updates-ci.ts publish-proposal --pin "$PIN" --sha "$SHA" --gate update
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ steps.check.outputs.pin }}
          SHA: ${{ steps.check.outputs.sha }}

  # Lands exactly the commit `publish` proved, or only deploys main when it already holds the pin (review F2, B1).
  land:
    needs: publish
    if: needs.publish.outputs.call_land == 'true' && inputs.dry_run != true
    permissions:
      contents: write
      actions: write
      statuses: read
    uses: ./.github/workflows/land.yml
    with:
      pin: ${{ needs.publish.outputs.pin }}
      sha: ${{ needs.publish.outputs.sha }}
      dry_run: ${{ inputs.dry_run == true }}
    # Pass the land environment's deploy key by name; land.yml's `land` job alone resolves it (land.yml header).
    secrets:
      T3FLARE_LAND_DEPLOY_KEY: ${{ secrets.T3FLARE_LAND_DEPLOY_KEY }}
